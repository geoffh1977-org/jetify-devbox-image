name: Docker Image

on:
  push:
    paths:
      - ".devbox-version"
      - "docker/**"
      - ".github/workflows/jetify-devbox-image.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.ref != 'refs/heads/main'
    uses: geoffh1977-org/github-actions/.github/workflows/docker-image.yml@main
    with:
      context: docker
      file: docker/Containerfile
      image: ${{ vars.DOCKER_USERNAME }}/jetify-devbox
      docker-username: ${{ vars.DOCKER_USERNAME }}
      version-file: .devbox-version
      version-build-arg: DEVBOX_VERSION
      platforms: linux/amd64,linux/arm64
      push: false

  publish:
    if: github.ref == 'refs/heads/main'
    uses: geoffh1977-org/github-actions/.github/workflows/docker-image.yml@main
    with:
      context: docker
      file: docker/Containerfile
      image: ${{ vars.DOCKER_USERNAME }}/jetify-devbox
      docker-username: ${{ vars.DOCKER_USERNAME }}
      version-file: .devbox-version
      version-build-arg: DEVBOX_VERSION
      platforms: linux/amd64,linux/arm64
      push: true
    secrets:
      docker-password: ${{ secrets.DOCKER_PASSWORD }}

name: Reusable Docker Image Workflow

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context relative to the repository root
        required: true
        type: string
      file:
        description: Containerfile path relative to the repository root
        required: true
        type: string
      image:
        description: Fully qualified Docker Hub image name, including namespace
        required: true
        type: string
      docker-username:
        description: Docker Hub username
        required: false
        type: string
      version-file:
        description: Version file path relative to the repository root
        required: true
        type: string
      version-build-arg:
        description: Docker build argument name to receive the version
        required: false
        default: VERSION
        type: string
      push:
        description: Push built tags to Docker Hub
        required: false
        default: false
        type: boolean
    secrets:
      docker-password:
        description: Docker Hub password or access token
        required: false

permissions:
  contents: read

jobs:
  docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read and validate version
        id: version
        shell: bash
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          VERSION_BUILD_ARG: ${{ inputs.version-build-arg }}
        run: |
          set -euo pipefail
          workspace="$(realpath -e -- "$GITHUB_WORKSPACE")"
          version_file="$(realpath -e -- "$workspace/$VERSION_FILE")"
          if [[ ! -f "$version_file" || "$version_file" != "$workspace/"* ]]; then
            printf '%s\n' "Invalid version file: expected a regular file within the repository workspace." >&2
            exit 1
          fi
          if [[ ! "$VERSION_BUILD_ARG" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            printf '%s\n' "Invalid version build argument: expected a shell-style identifier." >&2
            exit 1
          fi
          version="$(<"$version_file")"
          if [[ -z "$version" || "$version" =~ [[:space:]] || ! "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            printf '%s\n' "Invalid version: expected a nonempty release string containing only digits, letters, dots, hyphens, and plus signs." >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Lint Containerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.file }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker Hub credentials are available for publishing
        if: inputs.push
        env:
          DOCKER_USERNAME: ${{ inputs.docker-username }}
          DOCKER_PASSWORD: ${{ secrets['docker-password'] }}
        run: |
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_PASSWORD"

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker-username }}
          password: ${{ secrets['docker-password'] }}

      - name: Derive image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ inputs.push }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ${{ inputs.version-build-arg }}=${{ steps.version.outputs.VERSION }}
          provenance: true
          sbom: true

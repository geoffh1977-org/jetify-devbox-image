name: Reusable Docker Hub Documentation Workflow

on:
  workflow_call:
    inputs:
      image:
        description: Docker Hub repository in namespace/repository format
        required: true
        type: string
      docker-username:
        description: Docker Hub username
        required: true
        type: string
      markdown-file:
        description: Markdown file path relative to the repository root
        required: false
        default: README.md
        type: string
    secrets:
      docker-password:
        description: Docker Hub password or access token
        required: true

permissions:
  contents: read

jobs:
  docker-document:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Markdown file
        id: markdown
        shell: bash
        env:
          MARKDOWN_FILE: ${{ inputs.markdown-file }}
        run: |
          set -euo pipefail
          workspace="$(realpath -e -- "$GITHUB_WORKSPACE")"
          markdown_file="$(realpath -e -- "$workspace/$MARKDOWN_FILE")"
          if [[ ! -f "$markdown_file" || "$markdown_file" != "$workspace/"* ]]; then
            printf '%s\n' "Invalid Markdown file: expected a regular file within the repository workspace." >&2
            exit 1
          fi
          printf 'path=%s\n' "$markdown_file" >> "$GITHUB_OUTPUT"

      - name: Verify Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ inputs.docker-username }}
          DOCKER_PASSWORD: ${{ secrets['docker-password'] }}
        run: |
          test -n "$DOCKER_USERNAME"
          test -n "$DOCKER_PASSWORD"

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ inputs.docker-username }}
          password: ${{ secrets['docker-password'] }}
          repository: ${{ inputs.image }}
          readme-filepath: ${{ steps.markdown.outputs.path }}

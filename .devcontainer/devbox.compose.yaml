services:
  dev:
    image: geoffh1977/jetify-devbox:latest

    environment:
      # Imported Environment Variables
      - DOCKER_GID

      # GPG Agent Socket For Git GPG Signing
      - GPG_AGENT_SOCKET=${GPG_AGENT_SOCKET:-/run/user/${UID:-1000}/gnupg/S.gpg-agent}
      - GPG_AGENT_INFO=${GPG_AGENT_SOCKET:-/run/user/${UID:-1000}/gnupg/S.gpg-agent}

    volumes:
      # Per-user caches persist without replacing the image's Nix store.
      - nix_store:/nix
      - devbox_user_cache:/home/${UNAME:-devbox}/.devbox
      - bash_user_cache:/home/${UNAME:-devbox}/.config/bash

      # Mount The Current Project Directory
      - ${PWD}:/Project:cached

      # Mount GPG Socket Path (Needed For Git)
      - /run/user/${UID:-1000}/gnupg:/run/user/${UID:-1000}/gnupg:ro

      # Docker Docket Mount (For Docker-In-Docker)
      - /var/run/docker.sock:/var/run/docker.sock

      # Environment Configuration Files
      - ${ENVIRONMENT_PATH}/.config/git/config:/home/${UNAME:-devbox}/.config/git/config:ro
      - ${ENVIRONMENT_PATH}/.docker:/home/${UNAME:-devbox}/.docker
      - ${ENVIRONMENT_PATH}/.ssh:/home/${UNAME:-devbox}/.ssh:ro

    working_dir: /home/${UNAME:-devbox}
    stdin_open: true
    tty: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined

volumes:
  nix_store:
  devbox_user_cache:
  bash_user_cache:
